name: Peanut
description: 'Peanut is a social networking app founded in 2017 by Michelle Kennedy that connects
  women through all stages of womanhood — from fertility and pregnancy to motherhood and menopause.
  With over 5 million users, Peanut offers a swipe-based discovery experience to find like-minded
  women nearby, interest and life-stage communities, group and audio chat, direct messaging, and
  expert-reviewed content. It is a consumer mobile application (iOS and Android) with no public
  developer API surface. Added to the API Evangelist network as a portfolio-company profile.'
